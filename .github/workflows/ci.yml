name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Oldest runner image we support, so builds run on older distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ffmixer/package-lock.json

      # The Rust app embeds the built frontend, so build it first.
      - name: Frontend
        working-directory: apps/ffmixer
        run: |
          npm ci
          npm run build
          npm run check

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

  # 32-bit x86 build, cross-compiled with Ubuntu's i386 libraries. The
  # tests run too: the runner's kernel can execute 32-bit programs.
  check-i686:
    runs-on: ubuntu-22.04
    env:
      PKG_CONFIG_ALLOW_CROSS: "1"
      PKG_CONFIG_PATH: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
    steps:
      - uses: actions/checkout@v4

      - name: Install 32-bit system packages
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            libwebkit2gtk-4.1-dev:i386 \
            libxdo-dev:i386 \
            libssl-dev:i386 \
            libayatana-appindicator3-dev:i386 \
            librsvg2-dev:i386

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: i686

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ffmixer/package-lock.json

      - name: Frontend
        working-directory: apps/ffmixer
        run: |
          npm ci
          npm run build

      - name: Rust tests (32-bit)
        run: cargo test --workspace --target i686-unknown-linux-gnu

      - name: Build the app (32-bit)
        working-directory: apps/ffmixer
        run: npm run tauri -- build --no-bundle --target i686-unknown-linux-gnu
