[workspace]
resolver = "3"
members = [
    "apps/ffmixer/src-tauri",
    "crates/ffado-dbus",
    "crates/fw-meter",
    "crates/ffado-probe",
    "crates/mixer-core",
]

[workspace.package]
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/i/ffmixer"

[workspace.dependencies]
ffado-dbus = { path = "crates/ffado-dbus" }
fw-meter = { path = "crates/fw-meter" }
mixer-core = { path = "crates/mixer-core" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
