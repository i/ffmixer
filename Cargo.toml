[workspace]
resolver = "3"
members = [
    "crates/ffado-dbus",
    "crates/fw-meter",
    "crates/ffado-probe",
]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
ffado-dbus = { path = "crates/ffado-dbus" }
fw-meter = { path = "crates/fw-meter" }
libc = "0.2"
serde = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
